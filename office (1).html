<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>JFR Ranch Co. Ltd. — Cattle Office</title>
    <style>
        :root {
            --bg: #f5f5f0;
            --surface: #ffffff;
            --border: #d4d2c8;
            --text: #2c2c2a;
            --text-muted: #73726c;
            --accent: #5a3a1a;
            --accent-hover: #4a2f15;
            --danger: #993333;
            --success: #3b6d11;
            --warn: #b87800;
            --radius: 8px;
        }
        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 15px;
            line-height: 1.5;
            color: var(--text);
            background: var(--bg);
            min-height: 100vh;
        }
        h1, h2, h3, h4 { font-weight: 500; margin: 0; }
        h1 { font-size: 22px; }
        h2 { font-size: 18px; }
        h3 { font-size: 16px; }
        h4 { font-size: 13px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }

        header {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 14px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        header .brand { display: flex; align-items: baseline; gap: 12px; }
        header .brand .ranch { font-size: 18px; font-weight: 500; }
        header .brand .app { color: var(--text-muted); font-size: 14px; }
        header .user-info { display: flex; align-items: center; gap: 12px; font-size: 14px; }
        header .role-badge {
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 12px;
            background: var(--accent);
            color: white;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        header .role-badge.office { background: var(--text-muted); }
        header .role-badge.crew { background: #888; }
        main { max-width: 1100px; margin: 0 auto; padding: 24px; }

        button, .btn {
            font: inherit;
            padding: 8px 14px;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text);
            cursor: pointer;
            transition: background 120ms;
            margin-left: 6px;
        }
        button:first-child { margin-left: 0; }
        button:hover, .btn:hover { background: #ebeae3; }
        button.primary, .btn.primary {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }
        button.primary:hover, .btn.primary:hover { background: var(--accent-hover); }
        button.danger { background: var(--surface); color: var(--danger); border-color: var(--danger); }
        button.danger:hover { background: #fbeaea; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 14px;
        }
        label {
            display: block;
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 4px;
        }
        input, select, textarea {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            font: inherit;
            background: var(--surface);
            color: var(--text);
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--accent);
        }
        textarea { resize: vertical; min-height: 60px; }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px;
            margin-bottom: 18px;
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            gap: 12px;
            flex-wrap: wrap;
        }

        table { width: 100%; border-collapse: collapse; }
        th, td {
            text-align: left;
            padding: 10px 8px;
            border-bottom: 1px solid var(--border);
            font-size: 14px;
        }
        th {
            font-weight: 500;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-size: 11px;
        }
        tr:last-child td { border-bottom: none; }
        tr.clickable { cursor: pointer; }
        tr.clickable:hover { background: #fafaf6; }
        tr.closed-row { color: var(--text-muted); }
        td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
        td.muted { color: var(--text-muted); }

        .login-container {
            max-width: 360px;
            margin: 80px auto 0;
            padding: 32px 28px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
        }
        .login-container h1 { margin-bottom: 4px; }
        .login-container .subtitle {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 24px;
        }
        .login-container .form-row { margin-bottom: 14px; }
        .login-container button { width: 100%; margin-top: 8px; margin-left: 0; }

        .alert {
            padding: 10px 14px;
            border-radius: var(--radius);
            margin-bottom: 14px;
            font-size: 14px;
        }
        .alert.error { background: #fbeaea; color: var(--danger); border: 1px solid #f0c0c0; }
        .alert.success { background: #e8f3dc; color: var(--success); border: 1px solid #c0deaa; }
        .alert.info { background: #f0f0e8; color: var(--text-muted); border: 1px solid var(--border); }

        .empty {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
        }

        .modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.4);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }
        .modal-backdrop.show { display: flex; }
        .modal {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 24px;
            max-width: 600px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal h2 { margin-bottom: 14px; }
        .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px; }

        .detail-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }
        @media (max-width: 800px) {
            .detail-grid { grid-template-columns: repeat(2, 1fr); }
        }
        .stat {
            padding: 12px 14px;
            background: #fafaf6;
            border-radius: var(--radius);
        }
        .stat .label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
        .stat .value { font-size: 20px; font-variant-numeric: tabular-nums; margin-top: 2px; }
        .stat .sub { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

        .breadcrumb { color: var(--text-muted); margin-bottom: 14px; font-size: 14px; }
        .breadcrumb a { color: var(--accent); text-decoration: none; cursor: pointer; }
        .breadcrumb a:hover { text-decoration: underline; }

        .closeout-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
        @media (max-width: 800px) { .closeout-layout { grid-template-columns: 1fr; } }
        .closeout-inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .results-panel { background: #fafaf6; border-radius: var(--radius); padding: 14px; }
        .closed-banner {
            background: #fff7e0;
            color: var(--warn);
            border: 1px solid #f0d890;
            padding: 8px 14px;
            border-radius: var(--radius);
            font-size: 14px;
            margin-bottom: 14px;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="loginScreen">
    <div class="login-container">
        <h1>JFR Ranch Co. Ltd.</h1>
        <p class="subtitle">Cattle office sign-in</p>
        <div id="loginAlert"></div>
        <form id="loginForm">
            <div class="form-row">
                <label for="loginEmail">Email</label>
                <input type="email" id="loginEmail" required autocomplete="email">
            </div>
            <div class="form-row">
                <label for="loginPassword">Password</label>
                <input type="password" id="loginPassword" required autocomplete="current-password">
            </div>
            <button type="submit" class="primary" id="loginBtn">Sign in</button>
        </form>
    </div>
</div>

<div id="appShell" class="hidden">
    <header>
        <div class="brand">
            <span class="ranch">JFR Ranch Co. Ltd.</span>
            <span class="app">Cattle Office</span>
        </div>
        <div class="user-info">
            <span id="userName"></span>
            <span id="userRole" class="role-badge"></span>
            <button id="logoutBtn">Sign out</button>
        </div>
    </header>

    <main>
        <div id="globalAlert"></div>

        <div id="lotsView">
            <div class="card">
                <div class="card-header">
                    <h2>Lots</h2>
                    <button class="primary" id="newLotBtn">+ New lot</button>
                </div>
                <div id="lotsContent"><div class="empty">Loading…</div></div>
            </div>
        </div>

        <div id="detailView" class="hidden">
            <p class="breadcrumb"><a id="backToLots">← All lots</a></p>

            <div class="card">
                <div class="card-header">
                    <h2 id="detailLotNumber">—</h2>
                    <div>
                        <button id="duplicateLotBtn" title="Create a new lot pre-filled with this lot's settings">⎘ Duplicate</button>
                        <button id="closeLotBtn">Close lot</button>
                        <button id="editLotBtn">Edit lot</button>
                        <button id="newInvoiceBtn" class="primary">+ Add invoice</button>
                    </div>
                </div>
                <div id="closedBanner" class="closed-banner hidden"></div>
                <div id="lotMeta" class="muted" style="margin-bottom: 16px;"></div>
                <div class="detail-grid" id="lotStats"></div>
            </div>

            <div class="card">
                <h3 style="margin-bottom: 12px;">Invoices</h3>
                <div id="invoicesContent"><div class="empty">Loading…</div></div>
            </div>

            <div class="card">
                <div class="card-header">
                    <h3>Closeout calculator</h3>
                    <button id="saveAssumptionsBtn" class="primary hidden">Save to lot</button>
                </div>
                <p class="muted" style="font-size: 13px; margin-bottom: 14px;">
                    Adjust any field to see the projection update live. Click "Save to lot" to write changes back.
                </p>
                <div id="closeoutContent"><div class="empty">Loading…</div></div>
            </div>

            <div class="card hidden" id="notesCard">
                <h3 style="margin-bottom: 8px;">Notes</h3>
                <p id="notesContent" class="muted"></p>
            </div>
        </div>
    </main>
</div>

<div class="modal-backdrop" id="lotModal">
    <div class="modal">
        <h2 id="lotModalTitle">New lot</h2>
        <div id="lotModalAlert"></div>
        <form id="lotForm">
            <input type="hidden" id="lotId">
            <div class="form-grid" style="margin-bottom: 16px;">
                <div>
                    <label for="lotNumber">Lot number *</label>
                    <input type="text" id="lotNumber" required>
                </div>
                <div>
                    <label for="arrivalDate">Arrival date *</label>
                    <input type="date" id="arrivalDate" required>
                </div>
                <div>
                    <label for="source">Source</label>
                    <input type="text" id="source" placeholder="e.g. Joplin Regional">
                </div>
                <div>
                    <label for="sexClass">Sex / class</label>
                    <select id="sexClass">
                        <option value="">—</option>
                        <option value="steers">Steers</option>
                        <option value="heifers">Heifers</option>
                        <option value="mixed">Mixed</option>
                        <option value="bulls">Bulls</option>
                        <option value="cutting_bulls">Cutting Bulls</option>
                    </select>
                </div>
                <div>
                    <label for="startTag">Start tag</label>
                    <input type="number" id="startTag">
                </div>
                <div>
                    <label for="endTag">End tag</label>
                    <input type="number" id="endTag">
                </div>
                <div>
                    <label for="targetAdg">Target ADG (lb/day)</label>
                    <input type="number" id="targetAdg" step="0.01" placeholder="e.g. 2.50">
                </div>
            </div>
            <div>
                <label for="lotNotes">Notes</label>
                <textarea id="lotNotes"></textarea>
            </div>
            <div class="modal-actions">
                <button type="button" id="lotCancelBtn">Cancel</button>
                <button type="submit" class="primary" id="lotSaveBtn">Save lot</button>
            </div>
        </form>
    </div>
</div>

<div class="modal-backdrop" id="invoiceModal">
    <div class="modal">
        <h2>Add invoice</h2>
        <p class="muted" id="invoiceModalLot" style="margin-bottom: 14px;"></p>
        <div id="invoiceModalAlert"></div>
        <form id="invoiceForm">
            <div class="form-grid" style="margin-bottom: 16px;">
                <div>
                    <label for="invoiceDate">Invoice date *</label>
                    <input type="date" id="invoiceDate" required>
                </div>
                <div>
                    <label for="invoiceNumber">Invoice #</label>
                    <input type="text" id="invoiceNumber">
                </div>
                <div>
                    <label for="invHeadCount">Head count *</label>
                    <input type="number" id="invHeadCount" required min="1">
                </div>
                <div>
                    <label for="invTotalWeight">Total weight (lbs) *</label>
                    <input type="number" id="invTotalWeight" required step="0.01" min="0.01">
                </div>
                <div>
                    <label for="invTotalCost">Total cost ($) *</label>
                    <input type="number" id="invTotalCost" required step="0.01" min="0.01">
                </div>
            </div>
            <div>
                <label for="invoiceNotes">Notes</label>
                <textarea id="invoiceNotes"></textarea>
            </div>
            <div class="modal-actions">
                <button type="button" id="invoiceCancelBtn">Cancel</button>
                <button type="submit" class="primary" id="invoiceSaveBtn">Save invoice</button>
            </div>
        </form>
    </div>
</div>

<script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

    const SUPABASE_URL = 'https://xpfmebdzcxorvwikfvtj.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhwZm1lYmR6Y3hvcnZ3aWtmdnRqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcxMzgwNDcsImV4cCI6MjA5MjcxNDA0N30.IUFAj1F8YHpkupklqvr6h6_WY0cHxgU0Va5-OXPZ1u4';

    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentUser = null, currentProfile = null, currentLot = null, currentStatus = null;
    const $ = id => document.getElementById(id);

    function showAlert(id, msg, type='error'){
        const el=$(id); if(!el) return;
        el.innerHTML=`<div class="alert ${type}">${escapeHtml(msg)}</div>`;
        if(type==='success') setTimeout(()=>{el.innerHTML='';},3000);
    }
    function clearAlert(id){const el=$(id); if(el) el.innerHTML='';}
    function escapeHtml(s){if(s==null) return '';return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
    function fmtMoney(n){if(n==null||isNaN(n)) return '—';return '$'+Number(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});}
    function fmtNum(n,d=0){if(n==null||isNaN(n)) return '—';return Number(n).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});}
    function fmtDate(d){if(!d) return '—';return new Date(d).toLocaleDateString('en-US',{year:'numeric',month:'short',day:'numeric'});}
    function showModal(id){$(id).classList.add('show');}
    function hideModal(id){$(id).classList.remove('show');}
    function formatSexClass(v){if(!v) return '—';const m={steers:'Steers',heifers:'Heifers',mixed:'Mixed',bulls:'Bulls',cutting_bulls:'Cutting Bulls'};return m[v]||v;}

    // ---- AUTH ----
    async function checkSession(){
        const {data:{session}}=await supabase.auth.getSession();
        if(session) await onLoggedIn(session.user); else showLoginScreen();
    }
    async function onLoggedIn(user){
        currentUser=user;
        const {data:profile,error}=await supabase.from('user_profiles').select('*').eq('id',user.id).single();
        if(error||!profile){showAlert('loginAlert','Could not load your profile.');await supabase.auth.signOut();return;}
        currentProfile=profile;
        $('userName').textContent=profile.full_name;
        $('userRole').textContent=profile.role;
        $('userRole').className='role-badge '+profile.role;
        $('loginScreen').classList.add('hidden');
        $('appShell').classList.remove('hidden');
        showLotsList();
    }
    function showLoginScreen(){
        currentUser=null;currentProfile=null;
        $('appShell').classList.add('hidden');
        $('loginScreen').classList.remove('hidden');
        $('loginEmail').value='';$('loginPassword').value='';
    }
    $('loginForm').addEventListener('submit',async e=>{
        e.preventDefault();clearAlert('loginAlert');$('loginBtn').disabled=true;
        const {data,error}=await supabase.auth.signInWithPassword({email:$('loginEmail').value.trim(),password:$('loginPassword').value});
        $('loginBtn').disabled=false;
        if(error){showAlert('loginAlert',error.message);return;}
        await onLoggedIn(data.user);
    });
    $('logoutBtn').addEventListener('click',async()=>{await supabase.auth.signOut();showLoginScreen();});

    // ---- LOTS LIST ----
    async function showLotsList(){
        $('detailView').classList.add('hidden');
        $('lotsView').classList.remove('hidden');
        await loadLots();
    }
    async function loadLots(){
        $('lotsContent').innerHTML='<div class="empty">Loading…</div>';
        const {data,error}=await supabase.from('lot_status').select('*').order('arrival_date',{ascending:false});
        if(error){$('lotsContent').innerHTML=`<div class="alert error">Error: ${escapeHtml(error.message)}</div>`;return;}
        if(!data||data.length===0){$('lotsContent').innerHTML='<div class="empty">No lots yet. Click "+ New lot" to start.</div>';return;}
        const rows=data.map(l=>`
            <tr class="clickable ${l.closed_at?'closed-row':''}" data-lot-id="${l.lot_id}">
                <td><strong>${escapeHtml(l.lot_number)}</strong></td>
                <td>${fmtDate(l.arrival_date)}</td>
                <td>${escapeHtml(l.source||'—')}</td>
                <td>${formatSexClass(l.sex_class)}</td>
                <td class="num">${fmtNum(l.head_in)}</td>
                <td class="num">${fmtNum(l.head_current)}</td>
                <td class="num">${l.head_dead>0?fmtNum(l.head_dead):'—'}</td>
                <td class="num">${fmtNum(l.days_on_feed)}</td>
                <td class="num">${fmtMoney(l.avg_cost_per_head)}</td>
                <td>${l.closed_at?'<span class="muted">closed</span>':'<span style="color: var(--success);">open</span>'}</td>
            </tr>`).join('');
        $('lotsContent').innerHTML=`
            <table>
                <thead><tr>
                    <th>Lot #</th><th>Arrived</th><th>Source</th><th>Class</th>
                    <th class="num">Head in</th><th class="num">Head now</th>
                    <th class="num">Dead</th><th class="num">DOF</th>
                    <th class="num">$/Head</th><th>Status</th>
                </tr></thead>
                <tbody>${rows}</tbody>
            </table>`;
        $('lotsContent').querySelectorAll('tr.clickable').forEach(r=>r.addEventListener('click',()=>showLotDetail(r.dataset.lotId)));
    }

    // ---- LOT DETAIL ----
    async function showLotDetail(lotId){
        $('lotsView').classList.add('hidden');
        $('detailView').classList.remove('hidden');
        $('lotStats').innerHTML='';
        $('invoicesContent').innerHTML='<div class="empty">Loading…</div>';
        $('closeoutContent').innerHTML='<div class="empty">Loading…</div>';

        const [lotRes,statusRes,invoicesRes]=await Promise.all([
            supabase.from('lots').select('*').eq('id',lotId).single(),
            supabase.from('lot_status').select('*').eq('lot_id',lotId).single(),
            supabase.from('invoices').select('*').eq('lot_id',lotId).order('invoice_date',{ascending:true})
        ]);

        if(lotRes.error||statusRes.error){
            showAlert('globalAlert','Failed to load lot: '+(lotRes.error?.message||statusRes.error?.message));
            showLotsList();return;
        }

        currentLot=lotRes.data;
        currentStatus=statusRes.data;
        const invoices=invoicesRes.data||[];

        $('detailLotNumber').textContent=currentLot.lot_number;
        $('lotMeta').textContent=[
            `Arrived ${fmtDate(currentLot.arrival_date)}`,
            currentLot.source?`from ${currentLot.source}`:null,
            formatSexClass(currentLot.sex_class)!=='—'?formatSexClass(currentLot.sex_class):null,
            `FY ${currentLot.fiscal_year}`
        ].filter(Boolean).join(' · ');

        if(currentLot.closed_at){
            $('closedBanner').classList.remove('hidden');
            $('closedBanner').textContent=`Closed on ${fmtDate(currentLot.closed_at)}`;
            $('closeLotBtn').textContent='Re-open lot';
        } else {
            $('closedBanner').classList.add('hidden');
            $('closeLotBtn').textContent='Close lot';
        }

        const status=currentStatus;
        $('lotStats').innerHTML=`
            <div class="stat">
                <div class="label">Head in</div>
                <div class="value">${fmtNum(status.head_in)}</div>
                <div class="sub">${invoices.length} invoice${invoices.length===1?'':'s'}</div>
            </div>
            <div class="stat">
                <div class="label">Head now</div>
                <div class="value">${fmtNum(status.head_current)}</div>
                <div class="sub">${status.head_dead>0?status.head_dead+' dead':'0 dead'}${status.head_sold>0?', '+status.head_sold+' sold':''}</div>
            </div>
            <div class="stat">
                <div class="label">Days on feed</div>
                <div class="value">${fmtNum(status.days_on_feed)}</div>
                <div class="sub">since ${fmtDate(currentLot.arrival_date)}</div>
            </div>
            <div class="stat">
                <div class="label">Avg cost / head</div>
                <div class="value">${fmtMoney(status.avg_cost_per_head)}</div>
                <div class="sub">${status.avg_weight_in?fmtNum(status.avg_weight_in,1)+' lb avg in':''}</div>
            </div>`;

        if(invoices.length===0){
            $('invoicesContent').innerHTML='<div class="empty">No invoices yet. Click "+ Add invoice" to log the first.</div>';
        } else {
            const rows=invoices.map(inv=>{
                const avgWt=inv.head_count?(inv.total_weight_lb/inv.head_count):null;
                const avgCost=inv.head_count?(inv.total_cost/inv.head_count):null;
                return `<tr>
                    <td>${fmtDate(inv.invoice_date)}</td>
                    <td>${escapeHtml(inv.invoice_number||'—')}</td>
                    <td class="num">${fmtNum(inv.head_count)}</td>
                    <td class="num">${fmtNum(inv.total_weight_lb)}</td>
                    <td class="num">${fmtMoney(inv.total_cost)}</td>
                    <td class="num">${fmtNum(avgWt,1)}</td>
                    <td class="num">${fmtMoney(avgCost)}</td>
                </tr>`;
            }).join('');
            const totH=invoices.reduce((s,i)=>s+i.head_count,0);
            const totW=invoices.reduce((s,i)=>s+Number(i.total_weight_lb),0);
            const totC=invoices.reduce((s,i)=>s+Number(i.total_cost),0);
            const totRow=`<tr style="font-weight: 500; background: #fafaf6;">
                <td colspan="2">Total</td>
                <td class="num">${fmtNum(totH)}</td>
                <td class="num">${fmtNum(totW)}</td>
                <td class="num">${fmtMoney(totC)}</td>
                <td class="num">${totH?fmtNum(totW/totH,1):'—'}</td>
                <td class="num">${totH?fmtMoney(totC/totH):'—'}</td>
            </tr>`;
            $('invoicesContent').innerHTML=`<table>
                <thead><tr>
                    <th>Date</th><th>Invoice #</th>
                    <th class="num">Head</th><th class="num">Weight (lb)</th>
                    <th class="num">Cost</th><th class="num">Avg wt</th><th class="num">$/Head</th>
                </tr></thead>
                <tbody>${rows}${totRow}</tbody>
            </table>`;
        }

        renderCloseoutCalculator();

        if(currentLot.notes){
            $('notesCard').classList.remove('hidden');
            $('notesContent').textContent=currentLot.notes;
        } else {
            $('notesCard').classList.add('hidden');
        }
    }
    $('backToLots').addEventListener('click',showLotsList);

    // ---- CLOSEOUT CALCULATOR ----
    function renderCloseoutCalculator(){
        const lot=currentLot, status=currentStatus;
        const headIn=status.head_in||0;
        const totalWeightIn=Number(status.total_weight_in)||0;
        const avgWtIn=headIn?totalWeightIn/headIn:0;
        const targetDays=lot.target_days_on_feed||90;
        const targetAdg=Number(lot.target_adg)||2.5;
        const defaultFinishWt=avgWtIn?Math.round(avgWtIn+targetDays*targetAdg):'';

        $('closeoutContent').innerHTML=`
            <div class="closeout-layout">
                <div>
                    <h4 style="margin-bottom: 10px;">Assumptions</h4>
                    <div class="closeout-inputs">
                        <div><label>Target sale $/lb</label><input type="number" step="0.0001" id="calc_cwt" value="${lot.target_sale_cwt??''}" placeholder="e.g. 4.95"></div>
                        <div><label>Target days on feed</label><input type="number" id="calc_days" value="${lot.target_days_on_feed??''}" placeholder="e.g. 90"></div>
                        <div><label>Target ADG (lb/day)</label><input type="number" step="0.01" id="calc_adg" value="${lot.target_adg??''}" placeholder="e.g. 2.50"></div>
                        <div><label>Projected finish wt</label><input type="number" step="1" id="calc_finishwt" value="${defaultFinishWt}" placeholder="auto"></div>
                        <div><label>COG $/head</label><input type="number" step="0.01" id="calc_cog" value="${lot.assumed_cog_per_head??''}" placeholder="e.g. 218.14"></div>
                        <div><label>Labor $/head</label><input type="number" step="0.01" id="calc_labor" value="${lot.assumed_labor_per_head??''}" placeholder="e.g. 31.81"></div>
                        <div><label>Med $/head</label><input type="number" step="0.01" id="calc_med" value="${lot.assumed_med_per_head??''}" placeholder="e.g. 25.00"></div>
                        <div><label>Death loss %</label><input type="number" step="0.01" id="calc_dead" value="${lot.assumed_death_loss_pct!=null?(Number(lot.assumed_death_loss_pct)*100).toFixed(2):''}" placeholder="e.g. 6"></div>
                        <div style="grid-column: span 2;"><label>Interest %</label><input type="number" step="0.01" id="calc_int" value="${lot.assumed_interest_pct!=null?(Number(lot.assumed_interest_pct)*100).toFixed(2):''}" placeholder="e.g. 5"></div>
                    </div>
                </div>
                <div>
                    <h4 style="margin-bottom: 10px;">Projection</h4>
                    <div id="calcResults" class="results-panel"><div class="muted">Enter assumptions to see projection.</div></div>
                </div>
            </div>`;

        const inputs=['calc_cwt','calc_days','calc_adg','calc_finishwt','calc_cog','calc_labor','calc_med','calc_dead','calc_int'];
        let userTouchedFinish=lot.target_days_on_feed!=null;
        $('calc_finishwt').addEventListener('input',()=>{userTouchedFinish=true;});
        ['calc_days','calc_adg'].forEach(id=>{
            $(id).addEventListener('input',()=>{
                if(userTouchedFinish) return;
                const d=parseFloat($('calc_days').value)||0;
                const a=parseFloat($('calc_adg').value)||0;
                if(d>0&&a>0&&avgWtIn>0) $('calc_finishwt').value=Math.round(avgWtIn+d*a);
            });
        });
        inputs.forEach(id=>$(id).addEventListener('input',recalculate));
        recalculate();
    }

    function recalculate(){
        const num=id=>{const v=parseFloat($(id).value);return isNaN(v)?null:v;};
        const v={cwt:num('calc_cwt'),days:num('calc_days'),adg:num('calc_adg'),finishWt:num('calc_finishwt'),cog:num('calc_cog'),labor:num('calc_labor'),med:num('calc_med'),deadPct:num('calc_dead'),intPct:num('calc_int')};
        const status=currentStatus, lot=currentLot;
        const headIn=status.head_in||0;
        const totalCostIn=Number(status.total_cost_in)||0;
        const avgCostHead=headIn?totalCostIn/headIn:0;
        const target=$('calcResults');

        if(!headIn||v.cwt==null||v.finishWt==null){
            target.innerHTML=`<div class="muted" style="font-size: 14px;">${!headIn?'Add at least one invoice to enable closeout projections.':'Need target sale $/lb and projected finish weight.'}</div>`;
            $('saveAssumptionsBtn').classList.add('hidden');
            return;
        }

        const grossSale=v.cwt*v.finishWt;
        const cog=v.cog??0, labor=v.labor??0, med=v.med??0;
        const deadDec=(v.deadPct??0)/100, intDec=(v.intPct??0)/100;
        const intDays=v.days??0;
        const surviving=1-deadDec;
        const deadCostPerSurvivor=surviving>0?(avgCostHead*deadDec/surviving):0;
        const intCostPerHead=avgCostHead*intDec*(intDays/365);
        const totalCostPerHead=avgCostHead+cog+labor+med+deadCostPerSurvivor+intCostPerHead;
        const netPerHead=grossSale-totalCostPerHead;
        const netPct=totalCostPerHead>0?(netPerHead/totalCostPerHead):0;
        const headFinish=(status.head_current||headIn)*surviving;
        const totalNet=netPerHead*headFinish;
        const breakEven=v.finishWt>0?(totalCostPerHead/v.finishWt):0;

        const fmtPct=n=>(n*100).toFixed(2)+'%';
        const fmtSign=n=>(n>=0?'':'−')+fmtMoney(Math.abs(n));
        const goodColor=netPerHead>=0?'var(--success)':'var(--danger)';

        target.innerHTML=`
            <table style="font-size: 14px;">
                <tr><td>Avg cost in / head</td><td class="num">${fmtMoney(avgCostHead)}</td></tr>
                <tr><td>+ COG</td><td class="num">${fmtMoney(cog)}</td></tr>
                <tr><td>+ Labor</td><td class="num">${fmtMoney(labor)}</td></tr>
                <tr><td>+ Med</td><td class="num">${fmtMoney(med)}</td></tr>
                <tr><td>+ Death loss (${fmtPct(deadDec)})</td><td class="num">${fmtMoney(deadCostPerSurvivor)}</td></tr>
                <tr><td>+ Interest (${fmtPct(intDec)} × ${intDays} d)</td><td class="num">${fmtMoney(intCostPerHead)}</td></tr>
                <tr style="border-top: 2px solid var(--border);">
                    <td><strong>Total cost / head</strong></td>
                    <td class="num"><strong>${fmtMoney(totalCostPerHead)}</strong></td>
                </tr>
                <tr><td>Gross sale / head (${v.finishWt} × $${v.cwt.toFixed(4)})</td><td class="num">${fmtMoney(grossSale)}</td></tr>
                <tr style="font-size: 16px; background: ${netPerHead>=0?'#eaf3dc':'#fbeaea'};">
                    <td><strong>Net / head</strong></td>
                    <td class="num" style="color: ${goodColor};"><strong>${fmtSign(netPerHead)}</strong> <span style="font-size: 12px; color: var(--text-muted);">(${fmtPct(netPct)})</span></td>
                </tr>
                <tr><td colspan="2" style="padding-top: 12px;"></td></tr>
                <tr><td>Break-even sale $/lb</td><td class="num">$${breakEven.toFixed(4)}</td></tr>
                <tr><td>Surviving head at finish</td><td class="num">${fmtNum(headFinish,1)}</td></tr>
                <tr><td><strong>Projected lot net</strong></td><td class="num" style="color: ${goodColor};"><strong>${fmtSign(totalNet)}</strong></td></tr>
            </table>`;

        const stored={
            cwt:lot.target_sale_cwt!=null?Number(lot.target_sale_cwt):null,
            days:lot.target_days_on_feed,
            adg:lot.target_adg!=null?Number(lot.target_adg):null,
            cog:lot.assumed_cog_per_head!=null?Number(lot.assumed_cog_per_head):null,
            labor:lot.assumed_labor_per_head!=null?Number(lot.assumed_labor_per_head):null,
            med:lot.assumed_med_per_head!=null?Number(lot.assumed_med_per_head):null,
            deadPct:lot.assumed_death_loss_pct!=null?Number(lot.assumed_death_loss_pct)*100:null,
            intPct:lot.assumed_interest_pct!=null?Number(lot.assumed_interest_pct)*100:null
        };
        const eq=(a,b)=>(a==null&&b==null)||(a!=null&&b!=null&&Math.abs(a-b)<0.0001);
        const dirty=!(eq(v.cwt,stored.cwt)&&eq(v.days,stored.days)&&eq(v.adg,stored.adg)&&eq(v.cog,stored.cog)&&eq(v.labor,stored.labor)&&eq(v.med,stored.med)&&eq(v.deadPct,stored.deadPct)&&eq(v.intPct,stored.intPct));
        $('saveAssumptionsBtn').classList.toggle('hidden',!dirty);
    }

    $('saveAssumptionsBtn').addEventListener('click',async()=>{
        const num=id=>{const v=parseFloat($(id).value);return isNaN(v)?null:v;};
        const payload={
            target_sale_cwt:num('calc_cwt'),
            target_days_on_feed:num('calc_days'),
            target_adg:num('calc_adg'),
            assumed_cog_per_head:num('calc_cog'),
            assumed_labor_per_head:num('calc_labor'),
            assumed_med_per_head:num('calc_med'),
            assumed_death_loss_pct:num('calc_dead')!=null?num('calc_dead')/100:null,
            assumed_interest_pct:num('calc_int')!=null?num('calc_int')/100:null
        };
        $('saveAssumptionsBtn').disabled=true;
        const {error}=await supabase.from('lots').update(payload).eq('id',currentLot.id);
        $('saveAssumptionsBtn').disabled=false;
        if(error){showAlert('globalAlert','Save failed: '+error.message);return;}
        showAlert('globalAlert','Assumptions saved.','success');
        showLotDetail(currentLot.id);
    });

    // ---- LOT CREATE / EDIT / DUPLICATE ----
    function openLotModal(seed=null,mode='new'){
        clearAlert('lotModalAlert');
        $('lotModalTitle').textContent=mode==='edit'?'Edit lot':(mode==='duplicate'?'Duplicate lot':'New lot');
        $('lotId').value=mode==='edit'?(seed?.id||''):'';
        $('lotNumber').value=mode==='duplicate'?'':(seed?.lot_number||'');
        $('arrivalDate').value=mode==='duplicate'?'':(seed?.arrival_date||'');
        $('source').value=seed?.source||'';
        $('sexClass').value=seed?.sex_class||'';
        $('startTag').value=mode==='duplicate'?'':(seed?.start_tag||'');
        $('endTag').value=mode==='duplicate'?'':(seed?.end_tag||'');
        $('targetAdg').value=seed?.target_adg||'';
        $('lotNotes').value=mode==='duplicate'?'':(seed?.notes||'');
        $('lotForm').dataset.mode=mode;
        $('lotForm').dataset.seedId=mode==='duplicate'?(seed?.id||''):'';
        showModal('lotModal');
    }

    $('newLotBtn').addEventListener('click',()=>openLotModal(null,'new'));
    $('editLotBtn').addEventListener('click',()=>openLotModal(currentLot,'edit'));
    $('duplicateLotBtn').addEventListener('click',()=>openLotModal(currentLot,'duplicate'));
    $('lotCancelBtn').addEventListener('click',()=>hideModal('lotModal'));

    $('lotForm').addEventListener('submit',async e=>{
        e.preventDefault();clearAlert('lotModalAlert');$('lotSaveBtn').disabled=true;
        const id=$('lotId').value||null;
        const mode=$('lotForm').dataset.mode||'new';
        const seedId=$('lotForm').dataset.seedId||null;

        const payload={
            lot_number:$('lotNumber').value.trim(),
            arrival_date:$('arrivalDate').value,
            source:$('source').value.trim()||null,
            sex_class:$('sexClass').value||null,
            start_tag:$('startTag').value?parseInt($('startTag').value):null,
            end_tag:$('endTag').value?parseInt($('endTag').value):null,
            target_adg:$('targetAdg').value?parseFloat($('targetAdg').value):null,
            notes:$('lotNotes').value.trim()||null,
            created_by:currentUser.id
        };

        if(mode==='duplicate'&&seedId){
            const {data:seed}=await supabase.from('lots').select('*').eq('id',seedId).single();
            if(seed){
                payload.target_sale_cwt=seed.target_sale_cwt;
                payload.target_days_on_feed=seed.target_days_on_feed;
                payload.assumed_cog_per_head=seed.assumed_cog_per_head;
                payload.assumed_labor_per_head=seed.assumed_labor_per_head;
                payload.assumed_med_per_head=seed.assumed_med_per_head;
                payload.assumed_death_loss_pct=seed.assumed_death_loss_pct;
                payload.assumed_interest_pct=seed.assumed_interest_pct;
            }
        }

        let result;
        if(id){
            result=await supabase.from('lots').update(payload).eq('id',id).select().single();
        } else {
            result=await supabase.from('lots').insert(payload).select().single();
        }
        $('lotSaveBtn').disabled=false;
        if(result.error){showAlert('lotModalAlert',result.error.message);return;}
        hideModal('lotModal');
        if(id) showLotDetail(id); else showLotDetail(result.data.id);
    });

    // ---- CLOSE / RE-OPEN ----
    $('closeLotBtn').addEventListener('click',async()=>{
        if(!currentLot) return;
        const closing=!currentLot.closed_at;
        const verb=closing?'close':'re-open';
        if(!confirm(`Are you sure you want to ${verb} lot ${currentLot.lot_number}?`)) return;
        $('closeLotBtn').disabled=true;
        const {error}=await supabase.from('lots').update({closed_at:closing?new Date().toISOString():null}).eq('id',currentLot.id);
        $('closeLotBtn').disabled=false;
        if(error){showAlert('globalAlert','Failed: '+error.message);return;}
        showAlert('globalAlert',`Lot ${closing?'closed':'re-opened'}.`,'success');
        showLotDetail(currentLot.id);
    });

    // ---- INVOICE ----
    $('newInvoiceBtn').addEventListener('click',()=>{
        if(!currentLot) return;
        clearAlert('invoiceModalAlert');
        $('invoiceModalLot').textContent=`For lot ${currentLot.lot_number}`;
        $('invoiceForm').reset();
        showModal('invoiceModal');
    });
    $('invoiceCancelBtn').addEventListener('click',()=>hideModal('invoiceModal'));
    $('invoiceForm').addEventListener('submit',async e=>{
        e.preventDefault();clearAlert('invoiceModalAlert');$('invoiceSaveBtn').disabled=true;
        const payload={
            lot_id:currentLot.id,
            invoice_date:$('invoiceDate').value,
            invoice_number:$('invoiceNumber').value.trim()||null,
            head_count:parseInt($('invHeadCount').value),
            total_weight_lb:parseFloat($('invTotalWeight').value),
            total_cost:parseFloat($('invTotalCost').value),
            notes:$('invoiceNotes').value.trim()||null,
            created_by:currentUser.id
        };
        const {error}=await supabase.from('invoices').insert(payload);
        $('invoiceSaveBtn').disabled=false;
        if(error){showAlert('invoiceModalAlert',error.message);return;}
        hideModal('invoiceModal');
        showLotDetail(currentLot.id);
    });

    checkSession();
</script>
